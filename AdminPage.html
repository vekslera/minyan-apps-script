<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2230; --muted:#626a7a; --line:#dcd6ca; --soft:#f6f3ec; --accent:#1f4e79; --accent-soft:#e6eef6;
  --ok:#17734a; --ok-bg:#e9f6ef; --warn:#8a5300; --warn-bg:#fff3de; --err:#b42318; --err-bg:#fdeceb;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Assistant',system-ui,Arial,sans-serif;font-size:15px;color:var(--ink);background:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;position:sticky;top:0;background:#fff;z-index:5}
.tab{padding:10px 14px;border:0;background:none;font:inherit;font-weight:700;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:13px;text-align:center}
.view{padding:14px 18px 90px}
p.lead{margin:0 0 10px;color:var(--muted)}
textarea{width:100%;min-height:210px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{font:inherit;font-weight:700;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
input[type=date],input[type=text],input[type=tel],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input.tel{direction:ltr;text-align:right;width:140px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
tr.off td{opacity:.45}
.nm{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 9px;margin:2px;font-size:14px}
.nm button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 3px}
.w{color:var(--warn);font-weight:700}
.e{color:var(--err);font-weight:700}
.group{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:#fff}
.group.ready{border-color:#a8d8bf;background:#fbfefc}
.g-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.g-raw{font-size:19px;font-weight:800}
.g-meta{color:var(--muted);font-size:13px;margin-top:1px}
.g-note{color:var(--warn);font-size:13px;margin-top:3px;font-weight:600}
.g-err{color:var(--err);font-size:14px;margin-top:4px;font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.wait{background:var(--warn-bg);color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;cursor:pointer;background:#fafafa;font-size:14px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt input{margin:0}
.opt select{padding:2px 4px;font-size:13px;max-width:220px}
.ph{direction:ltr;unicode-bidi:isolate;color:var(--muted);font-size:13px}
.detail{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--soft)}
.detail label{display:inline-flex;gap:6px;align-items:center}
.detail .need{color:var(--warn);font-weight:700}
.detail .good{color:var(--ok);font-weight:700}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.note{padding:10px 12px;border-radius:9px;margin-bottom:10px;font-weight:600}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.err{background:var(--err-bg);color:var(--err)}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:17px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab" data-v="import">ייבוא מוואטסאפ</button>
  <button class="tab" data-v="review">רישומים לבדיקה <span class="count" id="cnt" hidden></span></button>
</div>

<section class="view" id="v-import" hidden>
  <p class="lead">העתיקו מהוואטסאפ את ההודעות עם רשימות הנוכחים והדביקו כאן. שורה עם תאריך (למשל 19/10) קובעת את התאריך לשמות שאחריה.</p>
  <textarea id="waText" placeholder="19/10&#10;כהן&#10;משה לוי&#10;פרידמן&#10;&#10;20/10&#10;..."></textarea>
  <div class="row">
    <label>תאריך לשמות שאין לפניהם תאריך: <input type="date" id="defDate"></label>
    <button class="btn primary" id="parseBtn" type="button">ניתוח הטקסט</button>
  </div>
  <div id="importNote"></div>
  <div id="preview"></div>
</section>

<section class="view" id="v-review" hidden>
  <div id="revNote"></div>
  <div class="row" id="revTools" hidden>
    <span id="revSummary" class="g-meta" style="font-size:14px"></span>
    <button class="btn" id="confirmAll" type="button">אישור כל ההתאמות הוודאיות</button>
  </div>
  <div id="groups"></div>
</section>

<div class="bar" id="bar" hidden>
  <span id="barMsg"></span>
  <button class="btn primary" id="barBtn" type="button"></button>
</div>

<script>
var TOKEN = '__TOKEN__', START = '__VIEW__';
var S = { view: '', imp: null, groups: [], people: [], byId: {}, dec: {}, errors: {}, busy: false };

function $(id) { return document.getElementById(id); }
function show(el, on) { (typeof el === 'string' ? $(el) : el).hidden = !on; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function call(fn, args, ok) {
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { busy(false); flash(S.view === 'import' ? 'importNote' : 'revNote', 'err', (e && e.message) || 'אירעה תקלה'); });
  r[fn].apply(r, args);
}
function flash(id, kind, text) { $(id).innerHTML = text ? '<div class="note ' + kind + '">' + esc(text) + '</div>' : ''; }
function busy(on) { S.busy = on; $('barBtn').disabled = on; }
var DOW = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
function dow(k) { return new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))).getUTCDay(); }
function dlabel(k) { return k ? DOW[dow(k)] + ' ' + k.slice(8, 10) + '/' + k.slice(5, 7) : ''; }
function normPhone(v) {
  var s = String(v || '').replace(/\D/g, '');
  if (s.indexOf('972') === 0) s = '0' + s.slice(3);
  if (s.length === 9 && s[0] === '5') s = '0' + s;
  return s;
}
function phoneOk(v) { var p = normPhone(v); return !p || /^0\d{8,9}$/.test(p); }

// ---------- Tabs ----------
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.onclick = function () { go(t.getAttribute('data-v')); }; });
function go(v) {
  S.view = v;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t.getAttribute('data-v') === v); });
  show('v-import', v === 'import'); show('v-review', v === 'review');
  if (v === 'review') loadReview(); else renderImportBar();
}

// =================== IMPORT ===================
$('parseBtn').onclick = function () {
  var text = $('waText').value;
  if (!text.trim()) return flash('importNote', 'err', 'לא הודבק טקסט');
  flash('importNote', '', '');
  $('parseBtn').disabled = true;
  call('adminParseImport', [TOKEN, text, $('defDate').value], function (res) {
    $('parseBtn').disabled = false;
    var groups = [], byDate = {};
    res.rows.forEach(function (r) {
      var k = r.date || '';
      if (!byDate[k]) { byDate[k] = { orig: k, date: k, names: [], off: false, shifted: false }; groups.push(byDate[k]); }
      if (r.shifted) byDate[k].shifted = true;
      byDate[k].names.push({ name: r.name, off: false });
    });
    S.imp = { groups: groups, today: res.today, info: res.dateInfo };
    renderImport();
  });
};

function groupIssue(g) {
  if (!g.date) return { level: 'e', text: 'חסר תאריך — בחרו תאריך' };
  if (g.date > S.imp.today) return { level: 'e', text: 'תאריך עתידי' };
  if (dow(g.date) === 6) return { level: 'e', text: 'שבת — תקנו את התאריך' };
  if (g.shifted && g.date === g.orig) return { level: 'w', text: 'ההודעה נשלחה בשבת/מוצאי שבת — נרשם ליום שישי. בדקו.' };
  var info = S.imp.info[g.date];
  if (info && info.noMinyan) return { level: 'w', text: 'מסומן כיום ללא מניין' };
  if (info && info.recorded) return { level: 'w', text: 'כבר יש ' + info.recorded + ' רישומים לתאריך זה (כפולים לא ייספרו פעמיים)' };
  return null;
}

function renderImport() {
  var imp = S.imp, box = $('preview');
  if (!imp.groups.length) { box.innerHTML = '<div class="empty">לא נמצאו שמות בטקסט</div>'; renderImportBar(); return; }
  var h = '<table><tr><th style="width:150px">תאריך</th><th style="width:60px">שמות</th><th>שמות שנמצאו (× להסרה)</th><th style="width:210px">הערה</th><th style="width:70px">לייבא?</th></tr>';
  imp.groups.forEach(function (g, gi) {
    var n = g.names.filter(function (x) { return !x.off; }).length, iss = groupIssue(g);
    h += '<tr class="' + (g.off ? 'off' : '') + '"><td><input type="date" data-g="' + gi + '" class="gdate" value="' + esc(g.date) + '"> ' +
         '<div class="g-meta">' + esc(dlabel(g.date)) + '</div></td><td>' + n + '</td><td>';
    g.names.forEach(function (x, ni) {
      if (!x.off) h += '<span class="nm">' + esc(x.name) + '<button type="button" title="הסרה" data-g="' + gi + '" data-n="' + ni + '" class="rm">×</button></span>';
    });
    h += '</td><td>' + (iss ? '<span class="' + iss.level + '">' + esc(iss.text) + '</span>' : '') + '</td>' +
         '<td><input type="checkbox" class="gon" data-g="' + gi + '"' + (g.off ? '' : ' checked') + '></td></tr>';
  });
  box.innerHTML = h + '</table>';
  Array.prototype.forEach.call(box.querySelectorAll('.gdate'), function (el) {
    el.onchange = function () { imp.groups[+el.getAttribute('data-g')].date = el.value; renderImport(); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('.rm'), function (el) {
    el.onclick = function () { imp.groups[+el.getAttribute('data-g')].names[+el.getAttribute('data-n')].off = true; renderImport(); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('.gon'), function (el) {
    el.onchange = function () { imp.groups[+el.getAttribute('data-g')].off = !el.checked; renderImport(); };
  });
  renderImportBar();
}

function importRows() {
  var rows = [];
  (S.imp ? S.imp.groups : []).forEach(function (g) {
    if (g.off) return;
    g.names.forEach(function (x) { if (!x.off) rows.push({ date: g.date, name: x.name }); });
  });
  return rows;
}
function renderImportBar() {
  if (S.view !== 'import') return;
  var rows = importRows();
  var blocked = S.imp && S.imp.groups.some(function (g) { var i = groupIssue(g); return !g.off && i && i.level === 'e'; });
  show('bar', !!(S.imp && S.imp.groups.length));
  $('barMsg').innerHTML = blocked ? '<span class="e">יש תאריכים לתיקון (או בטלו את הסימון "לייבא?")</span>' : rows.length + ' שמות מוכנים לבדיקה';
  $('barBtn').textContent = 'המשך לבדיקת השמות ←';
  $('barBtn').disabled = blocked || !rows.length;
  $('barBtn').onclick = queueImport;
}
function queueImport() {
  var rows = importRows();
  if (!rows.length || S.busy) return;
  busy(true);
  call('adminQueueImport', [TOKEN, rows], function (res) {
    busy(false);
    S.imp = null; $('waText').value = ''; $('preview').innerHTML = '';
    go('review');
    flash('revNote', 'ok', 'נוספו ' + res.added + ' רישומים לבדיקה' + (res.rejected ? ' (' + res.rejected + ' נדחו בגלל תאריך לא תקין)' : '') +
          '. לכל שם: בחרו את האדם הנכון, אשרו או הוסיפו טלפון, ולחצו "שמירה".');
  });
}

// =================== REVIEW ===================
function loadReview() {
  show('bar', false);
  $('groups').innerHTML = '<div class="empty">טוען…</div>';
  call('adminGetPending', [TOKEN], function (res) {
    S.groups = res.groups; S.people = res.people; S.byId = {};
    res.people.forEach(function (p) { S.byId[p.id] = p; });
    var keep = S.dec; S.dec = {};
    res.groups.forEach(function (g) { S.dec[g.gid] = keep[g.gid] || initDec(g); });
    renderReview();
  });
}

function initDec(g) {
  var d = { action: '', personId: '', confirmed: false, phone: g.phone ? g.phoneFmt : '', editPhone: false,
            first: g.first, last: g.last };
  if (g.decision === 'later') return d;
  if (g.decision === 'new') d.action = 'new';
  else if (g.bestId) { d.action = 'person'; d.personId = g.bestId; }
  return d;
}
function personPhone(id) { var p = S.byId[id]; return p ? p.phone : ''; }
function needsConfirm(g, d) {
  return d.action === 'person' && !!d.personId && (!!personPhone(d.personId) || g.decision === 'review') && !d.confirmed && !d.editPhone;
}
function isReady(g, d) {
  if (!phoneOk(d.phone)) return false;
  if (d.action === 'ignore') return true;
  if (d.action === 'person') return !!d.personId && !needsConfirm(g, d) && (!d.editPhone || !!normPhone(d.phone));
  if (d.action === 'new') return !!d.last.trim();
  return false;
}

function renderReview() {
  $('cnt').textContent = S.groups.length; show('cnt', S.groups.length > 0);
  show('revTools', S.groups.length > 0);
  if (!S.groups.length) { $('groups').innerHTML = '<div class="empty">אין רישומים שממתינים לבדיקה ✓</div>'; show('bar', false); return; }
  var days = S.groups.reduce(function (a, g) { return a + g.ids.length; }, 0);
  $('revSummary').textContent = S.groups.length + ' שמות שונים · ' + days + ' רישומים';
  $('groups').innerHTML = S.groups.map(function (g, i) { return '<div class="group" id="g' + i + '"></div>'; }).join('');
  S.groups.forEach(function (g, i) { renderGroup(i); });
  renderReviewBar();
}

function renderGroup(i) {
  var g = S.groups[i], d = S.dec[g.gid], el = $('g' + i), name = 'r' + i;
  var ready = isReady(g, d);
  el.className = 'group' + (ready ? ' ready' : '');
  var dates = g.dates.map(dlabel).join(', ');
  var h = '<div class="g-head"><div><span class="g-raw">' + esc(g.raw || '(בלי שם)') + '</span>' +
          (g.phone ? ' <span class="ph">' + esc(g.phoneFmt) + '</span>' : '') +
          '<div class="g-meta">' + g.ids.length + (g.ids.length === 1 ? ' יום' : ' ימים') + ': ' + esc(dates) + ' · ' + esc(g.sources.join(', ')) + '</div>' +
          (g.note ? '<div class="g-note">' + esc(g.note) + '</div>' : '') +
          (S.errors[g.gid] ? '<div class="g-err">' + esc(S.errors[g.gid]) + '</div>' : '') +
          '</div><span class="badge ' + (ready ? 'ok">מוכן' : 'wait">ממתין להחלטה') + '</span></div>';

  h += '<div class="opts">';
  var inCands = false;
  g.cands.forEach(function (c) {
    var sel = d.action === 'person' && d.personId === c.id;
    if (sel) inCands = true;
    h += '<label class="opt' + (sel ? ' sel' : '') + '"><input type="radio" name="' + name + '" data-a="person" data-id="' + c.id + '"' + (sel ? ' checked' : '') + '>' +
         '<b>' + esc(c.name) + '</b>' + (c.phone ? ' <span class="ph">' + esc(c.phone) + '</span>' : '') + '</label>';
  });
  var otherSel = d.action === 'person' && d.personId && !inCands;
  h += '<label class="opt' + (otherSel ? ' sel' : '') + '"><input type="radio" name="' + name + '" data-a="other"' + (otherSel ? ' checked' : '') + '>אדם אחר: ' +
       '<select data-k="other"><option value="">— בחרו —</option>' +
       S.people.map(function (p) { return '<option value="' + p.id + '"' + (otherSel && p.id === d.personId ? ' selected' : '') + '>' + esc(p.name) + (p.phone ? ' · ' + esc(p.phone) : '') + '</option>'; }).join('') +
       '</select></label>';
  h += '<label class="opt' + (d.action === 'new' ? ' sel' : '') + '"><input type="radio" name="' + name + '" data-a="new"' + (d.action === 'new' ? ' checked' : '') + '>אדם חדש</label>';
  h += '<label class="opt' + (d.action === 'ignore' ? ' sel' : '') + '"><input type="radio" name="' + name + '" data-a="ignore"' + (d.action === 'ignore' ? ' checked' : '') + '>לא לרשום</label>';
  h += '</div>';

  var badPhone = !phoneOk(d.phone) ? ' <span class="e">מספר לא תקין</span>' : '';
  if (d.action === 'person' && d.personId) {
    var pp = personPhone(d.personId);
    if (pp && !d.editPhone) {
      h += '<div class="detail"><span>טלפון רשום: <span class="ph" style="font-size:14px;color:var(--ink)">' + esc(pp) + '</span></span>' +
           '<label><input type="checkbox" data-k="confirm"' + (d.confirmed ? ' checked' : '') + '> <span class="' + (d.confirmed ? 'good' : 'need') + '">זה האיש הנכון</span></label>' +
           '<button class="btn" type="button" data-k="edit" style="padding:3px 10px;font-weight:600">הטלפון השתנה?</button></div>';
    } else {
      h += '<div class="detail"><label>' + (pp ? 'טלפון חדש:' : 'אין טלפון רשום. טלפון:') + ' <input type="tel" class="tel" data-k="phone" value="' + esc(d.phone) + '" placeholder="רשות"></label>' + badPhone +
           (g.decision === 'review' && !pp ? '<label><input type="checkbox" data-k="confirm"' + (d.confirmed ? ' checked' : '') + '> <span class="' + (d.confirmed ? 'good' : 'need') + '">זה האיש הנכון</span></label>' : '') +
           (pp ? '<button class="btn" type="button" data-k="unedit" style="padding:3px 10px;font-weight:600">ביטול</button>' : '') + '</div>';
    }
  } else if (d.action === 'new') {
    h += '<div class="detail"><label>שם פרטי <input type="text" data-k="first" value="' + esc(d.first) + '" style="width:130px"></label>' +
         '<label>שם משפחה* <input type="text" data-k="last" value="' + esc(d.last) + '" style="width:140px"></label>' +
         '<label>טלפון <input type="tel" class="tel" data-k="phone" value="' + esc(d.phone) + '" placeholder="מומלץ"></label>' + badPhone +
         (!normPhone(d.phone) ? '<span class="need">כדאי להוסיף טלפון</span>' : '') + '</div>';
  } else if (d.action === 'ignore') {
    h += '<div class="detail g-meta">הרישום לא ייספר</div>';
  }
  el.innerHTML = h;

  Array.prototype.forEach.call(el.querySelectorAll('input[type=radio]'), function (r) {
    r.onchange = function () {
      var a = r.getAttribute('data-a');
      d.confirmed = false; d.editPhone = false;
      if (a === 'person') { d.action = 'person'; d.personId = r.getAttribute('data-id'); }
      else if (a === 'other') { d.action = 'person'; d.personId = el.querySelector('select[data-k=other]').value; }
      else d.action = a;
      renderGroup(i); renderReviewBar();
    };
  });
  var sel = el.querySelector('select[data-k=other]');
  sel.onchange = function () { d.action = 'person'; d.personId = sel.value; d.confirmed = false; d.editPhone = false; renderGroup(i); renderReviewBar(); };
  bind(el, 'confirm', 'change', function (x) { d.confirmed = x.checked; renderGroup(i); renderReviewBar(); });
  bind(el, 'edit', 'click', function () { d.editPhone = true; d.phone = g.phone ? g.phoneFmt : ''; renderGroup(i); renderReviewBar(); var p = el.querySelector('[data-k=phone]'); if (p) p.focus(); });
  bind(el, 'unedit', 'click', function () { d.editPhone = false; d.phone = ''; renderGroup(i); renderReviewBar(); });
  ['phone', 'first', 'last'].forEach(function (k) {
    bind(el, k, 'input', function (x) { d[k] = x.value; refreshBadge(i); renderReviewBar(); });
    bind(el, k, 'change', function () { renderGroup(i); });
  });
}
function bind(el, k, ev, fn) { var x = el.querySelector('[data-k=' + k + ']'); if (x) x.addEventListener(ev, function () { fn(x); }); }
function refreshBadge(i) {
  var g = S.groups[i], el = $('g' + i), ready = isReady(g, S.dec[g.gid]);
  el.classList.toggle('ready', ready);
  var b = el.querySelector('.badge'); b.className = 'badge ' + (ready ? 'ok' : 'wait'); b.textContent = ready ? 'מוכן' : 'ממתין להחלטה';
}

$('confirmAll').onclick = function () {
  S.groups.forEach(function (g, i) {
    var d = S.dec[g.gid];
    if (g.decision === 'auto' && d.action === 'person' && d.personId === g.bestId) { d.confirmed = true; renderGroup(i); }
  });
  renderReviewBar();
};

function renderReviewBar() {
  if (S.view !== 'review') return;
  var ready = S.groups.filter(function (g) { return isReady(g, S.dec[g.gid]); }).length;
  show('bar', S.groups.length > 0);
  $('barMsg').textContent = 'מוכנים לשמירה: ' + ready + ' מתוך ' + S.groups.length + (ready < S.groups.length ? ' (השאר יחכו לפעם הבאה)' : '');
  $('barBtn').textContent = 'שמירה';
  $('barBtn').disabled = !ready || S.busy;
  $('barBtn').onclick = saveReview;
}

function saveReview() {
  if (S.busy) return;
  var list = [];
  S.groups.forEach(function (g) {
    var d = S.dec[g.gid];
    if (!isReady(g, d)) return;
    list.push({ gid: g.gid, ids: g.ids, action: d.action, personId: d.personId,
                first: d.first, last: d.last, phone: (d.action === 'person' && !d.editPhone && personPhone(d.personId)) ? '' : normPhone(d.phone) });
  });
  if (!list.length) return;
  busy(true);
  call('adminResolve', [TOKEN, list], function (res) {
    busy(false);
    S.errors = {};
    res.errors.forEach(function (e) { S.errors[e.gid] = e.msg; });
    var parts = [];
    if (res.saved) parts.push('נשמרו ' + res.saved + ' שמות (' + res.days + ' ימי נוכחות)');
    if (res.ignored) parts.push(res.ignored + ' סומנו "לא לרשום"');
    if (res.errors.length) parts.push(res.errors.length + ' לא נשמרו — ראו את ההערה באדום');
    flash('revNote', res.errors.length ? 'err' : 'ok', parts.join(' · '));
    loadReview();
  });
}

$('defDate').value = '';
go(START === 'review' ? 'review' : 'import');
</script>
</body>
</html>
