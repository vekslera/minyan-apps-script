<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --card:#fffdf9; --ink:#1c2230; --muted:#626a7a; --line:#d8d1c2;
  --accent:#1f4e79; --accent-soft:#e6eef6; --ok:#17734a; --ok-bg:#e4f4ec;
  --warn:#8a5300; --warn-bg:#fff2dc; --err:#b42318; --err-bg:#fdeceb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:18px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center;margin:6px 0 16px}
h1{font-size:32px;margin:0;font-weight:800;letter-spacing:-.3px}
.dates{color:var(--muted);font-size:17px;margin-top:4px}
.dates .heb{color:var(--ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(40,30,10,.06)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:700;margin-bottom:6px}
.field small{font-weight:400;color:var(--muted)}
.req{color:var(--err)}
input{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.16)}
input.tel{direction:ltr;text-align:right;letter-spacing:.5px}
.hit{border-radius:12px;padding:10px 14px;margin:-4px 0 14px;font-size:19px}
.hit.found{background:var(--ok-bg);color:var(--ok)}
.hit.new{background:var(--warn-bg);color:var(--warn);font-size:17px}
.sugg{margin:-2px 0 14px}
.sugg-title{font-weight:700;color:var(--muted);margin-bottom:8px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:19px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--accent-soft);color:var(--ink);cursor:pointer}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .hint{opacity:.65;font-size:15px;margin-right:8px;unicode-bidi:isolate}
.primary{width:100%;font:inherit;font-size:24px;font-weight:800;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;margin-top:4px}
.primary:disabled{opacity:.55;cursor:default}
.msg{padding:10px 14px;border-radius:12px;margin:0 0 12px;font-weight:700}
.msg.err{background:var(--err-bg);color:var(--err)}
.done{text-align:center;padding:26px 8px 10px}
.mark{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:56px;font-weight:800}
.mark.ok{background:var(--ok-bg);color:var(--ok)}
.mark.wait{background:var(--warn-bg);color:var(--warn)}
.done h2{font-size:30px;margin:0 0 6px}
.done p{margin:6px 0;color:var(--muted);font-size:20px}
.done .stats{margin-top:16px;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:19px}
.done .elig{color:var(--ok);font-weight:700}
.secondary{font:inherit;font-size:19px;padding:10px 22px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;margin-top:18px}
.closed{text-align:center;padding:30px 10px;font-size:23px;font-weight:700}
.closed small{display:block;font-weight:400;color:var(--muted);font-size:17px;margin-top:8px}
footer{text-align:center;margin-top:20px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:15px;cursor:pointer;padding:6px}
.gabbai{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:700}
.gabbai label{display:flex;gap:8px;align-items:center;font-weight:400}
.gabbai input{width:auto;font-size:17px;padding:6px 8px;border-radius:8px}
.gabbai .link{color:#cfd6e4}
.modal{position:fixed;inset:0;background:rgba(20,20,30,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:340px;text-align:center}
.modal h3{margin:0 0 12px;font-size:22px}
.modal input{text-align:center;letter-spacing:6px;direction:ltr}
.modal .row{display:flex;gap:10px;margin-top:12px}
.modal .row button{flex:1;margin:0}
.loading{text-align:center;color:var(--muted);padding:30px}
.device{color:var(--muted);font-size:12px;opacity:.7;margin-top:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">רישום נוכחות</h1>
    <div class="dates"><span class="heb" id="hebDate"></span><span id="sep" hidden> · </span><span id="gregDate"></span></div>
  </header>

  <div class="gabbai" id="gabbaiBar" hidden>
    <span>מצב גבאי</span>
    <label>תאריך <input type="date" id="date"></label>
    <button class="link" id="gabbaiOff" type="button">יציאה</button>
  </div>

  <div class="card">
    <div class="loading" id="loading">טוען…</div>
    <div class="closed" id="closed" hidden></div>

    <form id="form" autocomplete="off" novalidate hidden>
      <label class="field"><span>טלפון נייד <small>(מספיק בפעמים הבאות)</small></span>
        <input id="phone" class="tel" type="tel" inputmode="tel" maxlength="20" placeholder="05X-XXXXXXX"></label>
      <div id="phoneHit" class="hit" hidden></div>

      <div id="names">
        <label class="field"><span>שם משפחה <b class="req">*</b></span><input id="last" type="text"></label>
        <label class="field"><span>שם פרטי</span><input id="first" type="text"></label>
      </div>

      <div class="sugg" id="sugg" hidden>
        <div class="sugg-title">האם זה אחד מאלה?</div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="msg err" id="msg" hidden></div>
      <button class="primary" id="submit" type="submit">רישום נוכחות</button>
    </form>

    <div class="done" id="done" hidden>
      <div class="mark" id="mark">✓</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <div class="stats" id="doneStats" hidden></div>
      <button class="secondary" id="again" type="button">רישום נוסף</button>
    </div>
  </div>

  <footer><button class="link" id="gabbaiOn" type="button">מצב גבאי</button><div class="device" id="deviceLabel"></div></footer>
</div>

<div class="modal" id="pinDlg" hidden>
  <div class="box">
    <h3>כניסה למצב גבאי</h3>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="קוד">
    <div class="msg err" id="pinMsg" hidden style="margin-top:10px"></div>
    <div class="row">
      <button class="primary" id="pinOk" type="button">כניסה</button>
      <button class="secondary" id="pinCancel" type="button">ביטול</button>
    </div>
  </div>
</div>

<script>
/*__SHARED_JS__*/
</script>
<script>
var KEY = '__KEY__';
var FORCED_DEVICE = '__DEVICE__';
var DEVICE = detectDevice();

/**
 * 'mobile' (a phone), 'tablet', 'desktop' — or 'kiosk' when the link says &device=kiosk (the shul's tablet).
 * Client hints first (Chrome/Edge/Android), then the user-agent string. iPadOS reports itself as a Mac,
 * so a "Mac" with a touch screen is a tablet.
 */
function detectDevice() {
  if (FORCED_DEVICE && FORCED_DEVICE.indexOf('__') !== 0) return FORCED_DEVICE;
  var ua = navigator.userAgent || '';
  var uad = navigator.userAgentData;
  if (/iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini/i.test(ua)) return 'mobile';
  if (/iPad|Tablet|PlayBook|Silk|Kindle/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 0)) return 'tablet';
  if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'mobile' : 'tablet';      // Android tablets omit "Mobile"
  if (uad && uad.mobile === true) return 'mobile';
  return 'desktop';
}
var DEVICE_NAMES = { mobile: 'טלפון נייד', tablet: 'טאבלט', desktop: 'מחשב', kiosk: 'טאבלט בית הכנסת' };
var S = { info: null, roster: [], pin: '', selectedId: '', phoneId: '', seq: 0, lookupTimer: null, resetTimer: null, busy: false };

function $(id) { return document.getElementById(id); }
function show(el, on) { (typeof el === 'string' ? $(el) : el).hidden = !on; }
function call(fn, args, ok, fail) {
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || function (e) { setBusy(false); showMsg(errText(e)); });
  r[fn].apply(r, args);
}
function errText(e) { return (e && e.message) ? e.message : 'אירעה תקלה, נסו שוב'; }
function digits(s) { return String(s || '').replace(/\D/g, ''); }
function normPhone(v) { return normPhone_(v); }   // shared with the server (Matching.gs)
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function keyDate(k) { return new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), 12)); }
function shortDate(k) { return k.slice(8, 10) + '/' + k.slice(5, 7); }
function store(name, val) { try { if (val == null) sessionStorage.removeItem(name); else sessionStorage.setItem(name, val); } catch (e) {} }
function load(name) { try { return sessionStorage.getItem(name); } catch (e) { return null; } }

// ---------- Hebrew date ----------
function gem(n) {
  var ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'],
      hund = ['', 'ק', 'ר', 'ש', 'ת', 'תק', 'תר', 'תש', 'תת', 'תתק'];
  var s = hund[Math.floor(n / 100)], r = n % 100;
  if (r === 15) s += 'טו'; else if (r === 16) s += 'טז'; else s += tens[Math.floor(r / 10)] + ones[r % 10];
  return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
}
function hebDate(k) {
  try {
    var parts = new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).formatToParts(keyDate(k));
    var d = 0, m = '', y = 0;
    parts.forEach(function (p) {
      if (p.type === 'day') d = parseInt(p.value, 10);
      if (p.type === 'month') m = p.value;
      if (p.type === 'year' || p.type === 'relatedYear') y = parseInt(p.value, 10) || y;
    });
    if (!d || !m || !y) return '';
    if (m.charAt(0) !== 'ב') m = 'ב' + m;
    return gem(d) + ' ' + m + ' ' + gem(y % 1000);
  } catch (e) { return ''; }
}
function gregDate(k) {
  try { return new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(keyDate(k)); }
  catch (e) { return shortDate(k); }
}

// ---------- Startup & state ----------
function init() {
  call('kioskInit', [KEY], function (info) {
    S.info = info;
    S.roster = info.roster || S.roster;
    $('title').textContent = info.name || 'רישום נוכחות';
    var h = hebDate(info.today);
    $('hebDate').textContent = h;
    show('sep', !!h);
    $('gregDate').textContent = gregDate(info.today);
    show('loading', false);
    var pin = load('minyanPin');
    if (pin && !S.pin) { S.pin = pin; gabbaiUi(true); }
    refreshClosed();
  }, function (e) { $('loading').textContent = errText(e); });
}

function refreshClosed() {
  var i = S.info, why = '';
  if (!S.pin) {
    if (i.dow === 6) why = 'שבת שלום<small>אין רישום בשבת</small>';
    else if (i.noMinyan) why = 'היום אין רישום';
    else if (!i.open) why = 'הרישום סגור כעת<small>הרישום פתוח בין השעות ' + i.from + ':00 ל-' + i.to + ':00</small>';
  }
  $('closed').innerHTML = why;
  show('closed', !!why);
  if (!$('done').hidden) return;
  show('form', !why);
}

// ---------- Live lookup ----------
// Names are matched right here on the page (the same code as the server, see sharedJs_ in Utils.gs) against
// the roster sent by kioskInit, so typing never waits for the server. Only a complete phone number is
// looked up on the server, because the page never receives phone numbers.
function onPhone() {
  S.phoneId = '';
  var p = normPhone($('phone').value);
  if (validPhone_(p)) phoneLookup(p);
  else { S.seq++; show('phoneHit', false); show('names', true); localSuggest(); }
}
function onName() {
  S.selectedId = '';
  clearTimeout(S.lookupTimer);
  S.lookupTimer = setTimeout(localSuggest, 120);
}
function localSuggest() {
  if (S.phoneId) return;
  var first = $('first').value, last = $('last').value;
  if (norm_(last).length < 2 && norm_(first).length < 2) { renderChips([]); return; }
  renderChips(suggest_(S.roster, clean_(first), clean_(last)).slice(0, 6).map(function (c) {
    var p = c.person;
    return { id: p.id, name: (p.first + ' ' + p.last).trim(), first: p.first, last: p.last, hint: p.hint };
  }));
}
function phoneLookup(phone) {
  var my = ++S.seq;
  call('kioskLookup', [KEY, { phone: phone }], function (res) {
    if (my !== S.seq) return;
    var hit = $('phoneHit');
    if (res.byPhone) {
      S.phoneId = res.byPhone.id;
      hit.className = 'hit found';
      hit.innerHTML = 'שלום, <b>' + esc(res.byPhone.name) + '</b>';
      show(hit, true);
      show('names', false);
      renderChips([]);
      return;
    }
    show('names', true);
    hit.className = 'hit new';
    hit.textContent = 'מספר חדש — נא למלא שם משפחה ושם פרטי';
    show(hit, true);
    localSuggest();
  }, function () {});
}
function renderChips(cands) {
  var box = $('chips');
  box.innerHTML = '';
  cands.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (c.id === S.selectedId ? ' sel' : '');
    b.innerHTML = esc(c.name) + (c.hint ? '<span class="hint">· ' + esc(c.hint) + '</span>' : '');
    b.onclick = function () {
      S.selectedId = (S.selectedId === c.id) ? '' : c.id;
      if (S.selectedId) { $('last').value = c.last; $('first').value = c.first; }
      Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('sel'); });
      if (S.selectedId) b.classList.add('sel');
    };
    box.appendChild(b);
  });
  show('sugg', cands.length > 0);
}

// ---------- Submit ----------
function showMsg(t) { $('msg').textContent = t; show('msg', !!t); }
function setBusy(on) { S.busy = on; $('submit').disabled = on; $('submit').textContent = on ? 'רושם…' : 'רישום נוכחות'; }

function submit(ev) {
  ev.preventDefault();
  if (S.busy) return;
  showMsg('');
  var phone = normPhone($('phone').value), last = $('last').value.trim(), first = $('first').value.trim();
  var pid = S.selectedId || S.phoneId;
  if ($('phone').value.trim() && !validPhone_(phone)) return showMsg('מספר הטלפון אינו תקין');
  if (!pid && !last) { $('last').focus(); return showMsg('נא למלא שם משפחה'); }
  setBusy(true);
  call('kioskSubmit', [KEY, { phone: phone, first: first, last: last, personId: pid, device: S.pin ? '' : DEVICE,
                              pin: S.pin, date: S.pin ? $('date').value : '' }], done);
}

function done(res) {
  setBusy(false);
  if (!res.ok) return showMsg(res.message);
  if (res.person && !S.roster.some(function (p) { return p.id === res.person.id; })) S.roster.push(res.person);
  var g = !!S.pin, other = res.date !== S.info.today;
  var mark = $('mark'), title = '', text = '';
  if (res.status === 'pending') {
    mark.className = 'mark wait'; mark.textContent = '…';
    title = 'הרישום התקבל';
    text = 'הגבאי יאשר אותו בהמשך';
  } else {
    mark.className = 'mark ok'; mark.textContent = '✓';
    title = g ? res.name : 'תודה, ' + res.name + '!';
    if (res.status === 'already') text = other ? 'כבר רשום ל-' + shortDate(res.date) : 'כבר רשום להיום — אין צורך לרשום שוב';
    else text = other ? 'נרשם ל-' + shortDate(res.date) : (g ? 'נרשם להיום' : 'הנוכחות נרשמה להיום');
  }
  $('doneTitle').textContent = title;
  $('doneText').textContent = text;
  var st = res.stats;
  if (st) {
    $('doneStats').innerHTML = 'נוכחות בתקופה: <b>' + st.count + '</b> מתוך ' + st.days + ' ימים (' + st.pct + '%)' +
      (st.eligible ? '<br><span class="elig">✓ עומד בתנאי ההגרלה</span>' : '');
  }
  show('doneStats', !!st);
  show('form', false);
  show('done', true);
  clearTimeout(S.resetTimer);
  S.resetTimer = setTimeout(reset, g ? 2000 : 6000);
}

function reset() {
  clearTimeout(S.resetTimer);
  ['phone', 'last', 'first'].forEach(function (id) { $(id).value = ''; });
  S.selectedId = ''; S.phoneId = ''; S.seq++;
  show('phoneHit', false); show('names', true); renderChips([]); showMsg('');
  show('done', false);
  refreshClosed();
  if (S.pin) $('phone').focus();
}

// ---------- Gabbai mode ----------
function gabbaiUi(on) {
  show('gabbaiBar', on);
  show('gabbaiOn', !on);
  $('deviceLabel').textContent = on ? '' : (DEVICE_NAMES[DEVICE] || '');
  if (on) { $('date').value = S.info.today; $('date').max = S.info.today; }
}
function openPin() { $('pin').value = ''; show('pinMsg', false); show('pinDlg', true); $('pin').focus(); }
function checkPin() {
  var pin = $('pin').value.trim();
  if (!pin) return;
  call('kioskCheckPin', [KEY, pin], function (ok) {
    if (!ok) { $('pinMsg').textContent = 'קוד שגוי'; show('pinMsg', true); return; }
    S.pin = pin; store('minyanPin', pin);
    show('pinDlg', false);
    gabbaiUi(true);
    reset();
  }, function (e) { $('pinMsg').textContent = errText(e); show('pinMsg', true); });
}
function exitGabbai() { S.pin = ''; store('minyanPin', null); gabbaiUi(false); reset(); }

$('phone').addEventListener('input', onPhone);
$('last').addEventListener('input', onName);
$('first').addEventListener('input', onName);
$('form').addEventListener('submit', submit);
$('again').addEventListener('click', reset);
$('gabbaiOn').addEventListener('click', openPin);
$('gabbaiOff').addEventListener('click', exitGabbai);
$('pinOk').addEventListener('click', checkPin);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPin(); });
$('pinCancel').addEventListener('click', function () { show('pinDlg', false); });

$('deviceLabel').textContent = DEVICE_NAMES[DEVICE] || '';
init();
// Keep the date and the opening hours current on a tablet that stays on all day.
setInterval(function () {
  call('kioskInit', [KEY], function (info) {
    var changed = !S.info || info.today !== S.info.today;
    S.info = info;
    S.roster = info.roster || S.roster;
    if (changed) { $('hebDate').textContent = hebDate(info.today); $('gregDate').textContent = gregDate(info.today); if (S.pin) gabbaiUi(true); }
    refreshClosed();
  }, function () {});
}, 5 * 60 * 1000);
</script>
</body>
</html>
