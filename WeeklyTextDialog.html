<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><base target="_top"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:12px 16px;font-family:'Assistant',Arial,sans-serif;font-size:15px;color:#1c2230}
textarea{width:100%;height:390px;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #dcd6ca;border-radius:8px}
.btn{font:inherit;font-weight:700;padding:7px 16px;border-radius:8px;border:1px solid #1f4e79;background:#1f4e79;color:#fff;cursor:pointer;margin-top:8px}
.muted{color:#626a7a;font-size:14px;margin:0 0 8px}
</style></head>
<body>
<p class="muted">הדוח המלא נמצא בגיליון החדש. אפשר לערוך את הטקסט לפני ההעתקה.</p>
<textarea id="t">__TEXT__</textarea>
<button class="btn" id="copy" type="button">העתקה</button>
<script>
document.getElementById('copy').onclick = function () {
  var t = document.getElementById('t'), b = this;
  function ok() { b.textContent = 'הועתק ✓'; }
  t.select();
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok, function () { try { document.execCommand('copy'); ok(); } catch (e) {} });
  else { try { document.execCommand('copy'); ok(); } catch (e) {} }
};
</script>
</body></html>
